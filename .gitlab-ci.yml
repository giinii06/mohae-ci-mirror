stages: [verify]
verify:
  stage: verify
  image: oven/bun:1.3
  script:
    - bun install
    - bun run typecheck
    - bun test
    - bun run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
compose_lint:
  stage: verify
  image: docker:27-cli
  script:
    - apk add --no-cache bash
    - bash -n deploy/init-secrets.sh
    - mkdir -p secrets
    - for name in mohae_bot_token collector_bot_token polly_bot_token mohae_api_key collector_api_key polly_api_key journal_key; do printf placeholder > "secrets/$name"; done
    - export ALLOWED_GUILD_IDS=123456789012345678 COLLECTOR_CHANNEL_IDS=123456789012345679
    - docker compose -f compose.yaml config --quiet
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
